name: hardware-test-runner

services:
  runner:
    build:
      context: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${TEST_RUNNER_PORT:-8080}:8080"
    environment:
      DOCKER_BUILDKIT: "1"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${TEST_RUNNER_FRAMEWORK_SOURCE:-/opt/hardware-runner/framework}
      TEST_RUNNER_STATE_DIRECTORY: /runtime/state
      TEST_RUNNER_FRAMEWORK_SOURCE: ${TEST_RUNNER_FRAMEWORK_SOURCE:-/opt/hardware-runner/framework}
      TEST_RUNNER_FRAMEWORK_DOCKERFILE: ${TEST_RUNNER_FRAMEWORK_DOCKERFILE:-/opt/hardware-runner/framework/Dockerfile}
      TEST_RUNNER_INVENTORY_FILE: ${TEST_RUNNER_INVENTORY_FILE:-/opt/hardware-runner/inventory/stands.yaml}
      TEST_RUNNER_ARTIFACTS_DIRECTORY: ${TEST_RUNNER_ARTIFACTS_DIRECTORY:-/opt/hardware-runner/artifacts}
      TEST_RUNNER_ENV_FILE: ${TEST_RUNNER_ENV_FILE:-/opt/hardware-runner/test.env}
      TEST_RUNNER_KNOWN_HOSTS_FILE: ${TEST_RUNNER_KNOWN_HOSTS_FILE:-/opt/hardware-runner/known_hosts}
      TEST_RUNNER_ALLOWED_IMAGE_PREFIXES: ${TEST_RUNNER_ALLOWED_IMAGE_PREFIXES:-sha256:}
      TEST_RUNNER_DOCKER_NETWORK: ${TEST_RUNNER_DOCKER_NETWORK:-}
      TEST_RUNNER_OPERATION_TIMEOUT_SECONDS: ${TEST_RUNNER_OPERATION_TIMEOUT_SECONDS:-3600}
      TEST_RUNNER_AUTH_ENABLED: ${TEST_RUNNER_AUTH_ENABLED:-false}
      TEST_RUNNER_AUTH_USERNAME: ${TEST_RUNNER_AUTH_USERNAME:-}
      TEST_RUNNER_AUTH_PASSWORD: ${TEST_RUNNER_AUTH_PASSWORD:-}
      TEST_RUNNER_AUTH_SESSION_SECRET: ${TEST_RUNNER_AUTH_SESSION_SECRET:-}
      TEST_RUNNER_AUTH_SESSION_TTL_SECONDS: ${TEST_RUNNER_AUTH_SESSION_TTL_SECONDS:-604800}
      TEST_RUNNER_AUTH_COOKIE_SECURE: ${TEST_RUNNER_AUTH_COOKIE_SECURE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TEST_RUNNER_FRAMEWORK_SOURCE:-/opt/hardware-runner/framework}:${TEST_RUNNER_FRAMEWORK_SOURCE:-/opt/hardware-runner/framework}:ro
      - ${TEST_RUNNER_INVENTORY_DIRECTORY:-/opt/hardware-runner/inventory}:${TEST_RUNNER_INVENTORY_DIRECTORY:-/opt/hardware-runner/inventory}:ro
      - ${TEST_RUNNER_ARTIFACTS_DIRECTORY:-/opt/hardware-runner/artifacts}:${TEST_RUNNER_ARTIFACTS_DIRECTORY:-/opt/hardware-runner/artifacts}
      - ${TEST_RUNNER_STATE_DIRECTORY:-/opt/hardware-runner/state}:/runtime/state
      - ${TEST_RUNNER_ENV_FILE:-/opt/hardware-runner/test.env}:${TEST_RUNNER_ENV_FILE:-/opt/hardware-runner/test.env}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
