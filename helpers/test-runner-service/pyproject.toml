[project]
name = "hardware-test-runner-service"
version = "0.1.0"
description = "Minimal API runner for one laboratory hardware-test server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
hardware-test-runner = "test_runner_service.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_runner_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/test_runner_service/static/index.html" = "test_runner_service/static/index.html"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ANN", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
