[project]
name = "pytest-hardware-template"
version = "0.1.0"
description = "A template for automated hardware testing"
readme = "README.md"
authors = [
    { name = "Aleksei Fomenko", email = "fomenko_ai@proton.me" },
]
requires-python = ">=3.14"
dependencies = [
    "paramiko>=4.0.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.11.0",
    "pytest>=9.0.0",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.2",
    "yaml-test-params[pytest]>=0.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_test"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1a21",
]

[project.entry-points.pytest11]
hardware-test = "hardware_test.pytest_plugin"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
timeout = 120
log_file_level = "DEBUG"
log_file_format = "%(asctime)s.%(msecs)03d | %(levelname)-5s | %(name)-32s | %(message)s"
log_file_date_format = "%H:%M:%S"
markers = [
    "unit: isolated tests without external systems",
    "integration: component integration tests without physical hardware",
    "hardware: tests that require physical hardware",
    "smoke: fast checks of essential hardware behavior",
    "slow: long-running tests",
    "destructive: tests that may change or disrupt device state",
    "stop_on_fail: stop the test session when the marked test fails",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PT", "ANN", "S", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
