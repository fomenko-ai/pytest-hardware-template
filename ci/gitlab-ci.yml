stages:
  - test

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

quality:
  stage: test
  image: ghcr.io/astral-sh/uv:0.12.5-python3.14-trixie-slim
  timeout: 15 minutes
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  script:
    - ./scripts/ci.sh
  after_script:
    - uv cache prune --ci
